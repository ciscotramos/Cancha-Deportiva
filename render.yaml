# Blueprint de Render: despliegue público del sistema desde GitHub.
services:
  - type: web
    name: arena7-reservas
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /index.html
    envVars:
      - key: ADMIN_PASSWORD        # contraseña del admin en la demo pública
        sync: false
      - key: RENIEC_TOKEN          # token de Decolecta
        sync: false
      - key: MP_PUBLIC_KEY         # credenciales de prueba de Mercado Pago
        sync: false
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: MP_MODE
        value: prueba
      # Correo: el plan gratuito de Render bloquea los puertos SMTP (465/587),
      # por eso en la nube se envía por API HTTPS. Prioridad: Gmail > Brevo > Resend.
      - key: BREVO_API_KEY         # clave API de Brevo: envía a cualquier destinatario con un remitente validado
        sync: false
      - key: RESEND_API_KEY        # alternativa: Resend (sin dominio propio solo entrega al correo de la cuenta)
        sync: false
      - key: MAIL_FROM             # "Arena 7 <remitente validado en Brevo>" o "Arena 7 <onboarding@resend.dev>"
        sync: false
      # Gmail SMTP solo funciona en local/Docker o en una instancia pagada; si se
      # completa, tiene prioridad sobre Resend. Dejar vacío en el plan gratuito.
      - key: GMAIL_ADDRESS
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
